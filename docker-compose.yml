# Local/dev stack for Qitab-e-Noor: Postgres + API + web build, all in
# containers. The mobile app isn't here — it's native and runs through Expo
# (`npm start`), not Docker — but the web build of the same codebase is.
#
# Usage:
#   cp .env.example .env        # fill in ANTHROPIC_API_KEY etc. if you want them
#   docker compose up --build
#
# First run only, once the db is healthy:
#   docker compose run --rm migrate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qitabe_noor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migration. Run explicitly with `docker compose run --rm
  # migrate` — it isn't part of `up` because it should only ever run once per
  # fresh database, not on every restart.
  migrate:
    build:
      context: ./server
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/qitabe_noor
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/qitabe_noor
      PGSSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-string-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:
