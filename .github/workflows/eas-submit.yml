# Release build (and optional store submission) for Qitab-e-Noor.
#
# Manual only — there is no push or schedule trigger. A store release should
# be a deliberate act, and `production` builds consume EAS build minutes and
# increment the remote version counter.
#
# Before this can succeed you need an EXPO_TOKEN repository secret and store
# credentials registered with EAS. See the release checklist in the PR/summary
# that introduced this file.

name: EAS Build & Submit

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      submit:
        description: "Submit the build to the App Store / Play Store"
        type: boolean
        required: true
        default: false

# Two release builds racing each other would fight over the remote version
# counter, so let an in-flight run finish rather than cancelling it.
concurrency:
  group: eas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.profile }}${{ inputs.submit && ' + submit' || '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A release build is the worst place to discover a broken test. EAS
      # minutes are consumed whether or not the code works, and a production
      # build also increments the remote version counter, so a failure here is
      # cheaper than one three steps later.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Both of these fail deep inside the EAS CLI with errors that do not name
      # the real cause, so check them here where the message can be useful.
      - name: Preflight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          fail=0

          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a token at"               "https://expo.dev -> Account Settings -> Access Tokens, then add it under"               "Settings -> Secrets and variables -> Actions as EXPO_TOKEN."
            fail=1
          fi

          if ! node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::error::app.json has no extra.eas.projectId — the repo is not linked to"               "an EAS project. Run 'eas init' locally and commit the change."
            fail=1
          fi

          if ! node -e "process.exit(require('./app.json').expo?.android?.package ? 0 : 1)"; then
            echo "::error::app.json is missing android.package, which Play requires."
            fail=1
          fi

          if ! node -e "process.exit(require('./app.json').expo?.ios?.bundleIdentifier ? 0 : 1)"; then
            echo "::error::app.json is missing ios.bundleIdentifier, which the App Store requires."
            fail=1
          fi

          # An empty submit.production cannot submit unattended: Android needs a
          # track and iOS needs an ascAppId.
          if [ "${{ inputs.submit }}" = "true" ]; then
            if ! node -e "const s=require('./eas.json').submit?.production||{}; process.exit(s.android?.track ? 0 : 1)"; then
              echo "::error::submit.production.android.track is not set in eas.json,"                 "so 'eas submit --non-interactive' has no track to publish to."
              fail=1
            fi
            if ! node -e "const s=require('./eas.json').submit?.production||{}; process.exit(s.ios?.ascAppId ? 0 : 1)"; then
              echo "::error::submit.production.ios.ascAppId is not set in eas.json."                 "Take the numeric id from the App Store Connect URL for your app."
              fail=1
            fi
          fi

          # A production build bakes EXPO_PUBLIC_API_URL into the bundle and
          # cannot be repointed afterwards. Shipping one aimed at a host that
          # does not resolve gives every user a silently dead backend — no
          # sync, no live AI — so refuse to build it. Preview builds only warn:
          # they are internal, and pointing one at a not-yet-live host is a
          # legitimate thing to do.
          api_url=$(node -e "
            const j = require('./eas.json');
            const resolve = (name, seen = new Set()) => {
              if (!name || seen.has(name)) return {};
              seen.add(name);
              const p = j.build?.[name] || {};
              return { ...resolve(p.extends, seen), ...(p.env || {}) };
            };
            process.stdout.write(resolve('${{ inputs.profile }}').EXPO_PUBLIC_API_URL || '');
          ")

          if [ -z "$api_url" ]; then
            echo "::warning::No EXPO_PUBLIC_API_URL for profile '${{ inputs.profile }}';"               "the app will fall back to its localhost default."
          else
            api_host=$(node -e "process.stdout.write(new URL('$api_url').hostname)")
            echo "Backend for '${{ inputs.profile }}': $api_url (host $api_host)"

            if getent hosts "$api_host" > /dev/null 2>&1; then
              echo "  $api_host resolves."

              # Resolving is necessary but not sufficient: the host can exist
              # and still be a parked page, an expired deploy, or an API whose
              # AI route answers anonymous callers. A production build is
              # permanent, so check the backend properly before baking the URL
              # into it.
              if [ "${{ inputs.profile }}" = "production" ]; then
                if ! node scripts/verify-deployment.js "$api_url"; then
                  echo "::error::The production backend at $api_url failed"                     "verification (see the report above). Fix the deployment before"                     "shipping a build that points at it."
                  fail=1
                fi
              fi
            elif [ "${{ inputs.profile }}" = "production" ]; then
              echo "::error::$api_host does not resolve in DNS, so this production"                 "build would ship pointing at a backend that does not exist."                 "Register and deploy the host, or change EXPO_PUBLIC_API_URL in"                 "eas.json to one that is live."
              fail=1
            else
              echo "::warning::$api_host does not resolve in DNS. This build will"                 "have no working backend until it does."
            fi
          fi

          [ "$fail" = "0" ] || exit 1
          echo "Preflight passed."

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build for iOS and Android
        run: eas build --platform all --non-interactive --profile ${{ inputs.profile }} --wait

      - name: Submit to the stores
        if: ${{ inputs.submit }}
        run: eas submit --platform all --non-interactive --latest
